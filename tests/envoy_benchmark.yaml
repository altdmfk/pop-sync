# ==============================================================================
# Envoy v3 Benchmark Configuration for ext_authz & Proxy Overhead Isolation
# ==============================================================================
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    # --------------------------------------------------------------------------
    # Tier 2 Listener: Pure Proxy-Only Hop (Port 10000)
    # Measures the intrinsic L7 Envoy proxy latency without external authorization
    # --------------------------------------------------------------------------
    - name: proxy_only_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_proxy_only
                route_config:
                  name: proxy_only_route
                  virtual_hosts:
                    - name: backend_direct
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: backend_service
                            timeout: 5.0s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # --------------------------------------------------------------------------
    # Tier 3 Listener: Envoy + PoP-Sync ext_authz (Port 10001 / 8443)
    # Evaluates PoP-Sync PDP evaluation overhead and backend protection efficacy
    # --------------------------------------------------------------------------
    - name: ext_authz_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10001
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_ext_authz
                route_config:
                  name: ext_authz_route
                  virtual_hosts:
                    - name: protected_service
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: backend_service
                            timeout: 5.0s
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: false
                      status_on_error:
                        code: ServiceUnavailable
                      http_service:
                        server_uri:
                          uri: "http://gateway:8000/auth"
                          cluster: pop_sync_service
                          timeout: 0.25s
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - exact: "authorization"
                              - exact: "x-nonce"
                              - exact: "x-spiffe-id"
                              - exact: "x-res"
                              - exact: "x-act"
                              - exact: "x-pop-signature"
                              - exact: "x-body-digest"
                              - exact: "x-bench-mode"
                              - exact: "content-type"
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - exact: "x-authenticated-spiffe-id"
                              - exact: "x-policy-decision"
                              - exact: "x-auth-source"
                          allowed_client_headers_on_error:
                            patterns:
                              - exact: "retry-after"
                              - exact: "content-type"
                      with_request_body:
                        max_request_bytes: 65536
                        allow_partial_message: false
                        pack_as_bytes: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # --------------------------------------------------------------------------
    # Mock Backend Cluster (Target Upstream)
    # --------------------------------------------------------------------------
    - name: backend_service
      type: STRICT_DNS
      connect_timeout: 0.25s
      load_assignment:
        cluster_name: backend_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: mock_backend
                      port_value: 8080
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}

    # --------------------------------------------------------------------------
    # PoP-Sync PDP Cluster (External Authorization Service)
    # --------------------------------------------------------------------------
    - name: pop_sync_service
      type: STRICT_DNS
      connect_timeout: 0.25s
      load_assignment:
        cluster_name: pop_sync_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: gateway
                      port_value: 8000
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
