version: '3.8'
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  policy_db:
    build: .
    command: python policy_db.py
    ports:
      - "8000:8000"
    environment:
      - SIMULATED_DB_LATENCY_SEC=${SIMULATED_DB_LATENCY_SEC:-0.02}
      - ADMIN_SECRET_TOKEN=${ADMIN_SECRET_TOKEN}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/policy/test?sid=1&res=1')"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway-a:
    build: .
    command: python gateway.py --node Node-A --port 8001
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=http://policy_db:8000
      - ADMIN_SECRET_TOKEN=${ADMIN_SECRET_TOKEN}
      - SINGLEFLIGHT_ENABLED=${SINGLEFLIGHT_ENABLED:-true}
      - CLUSTER_SINGLEFLIGHT_ENABLED=${CLUSTER_SINGLEFLIGHT_ENABLED:-true}
      - RL_ALGORITHM=${RL_ALGORITHM:-sliding}
      - POP_VERIFY_ENABLED=${POP_VERIFY_ENABLED:-false}
    depends_on:
      redis:
        condition: service_healthy
      policy_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway-b:
    build: .
    command: python gateway.py --node Node-B --port 8002
    ports:
      - "8002:8002"
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=http://policy_db:8000
      - ADMIN_SECRET_TOKEN=${ADMIN_SECRET_TOKEN}
      - SINGLEFLIGHT_ENABLED=${SINGLEFLIGHT_ENABLED:-true}
      - CLUSTER_SINGLEFLIGHT_ENABLED=${CLUSTER_SINGLEFLIGHT_ENABLED:-true}
      - RL_ALGORITHM=${RL_ALGORITHM:-sliding}
      - POP_VERIFY_ENABLED=${POP_VERIFY_ENABLED:-false}
    depends_on:
      redis:
        condition: service_healthy
      policy_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway-c:
    build: .
    command: python gateway.py --node Node-C --port 8003
    ports:
      - "8003:8003"
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=http://policy_db:8000
      - ADMIN_SECRET_TOKEN=${ADMIN_SECRET_TOKEN}
      - SINGLEFLIGHT_ENABLED=${SINGLEFLIGHT_ENABLED:-true}
      - CLUSTER_SINGLEFLIGHT_ENABLED=${CLUSTER_SINGLEFLIGHT_ENABLED:-true}
      - RL_ALGORITHM=${RL_ALGORITHM:-sliding}
      - POP_VERIFY_ENABLED=${POP_VERIFY_ENABLED:-false}
    depends_on:
      redis:
        condition: service_healthy
      policy_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  control_plane:
    build: .
    command: python control_plane.py
    ports:
      - "8080:8080"
    volumes:
      - ./static:/app/static
      - ./control_plane.py:/app/control_plane.py
    environment:
      - REDIS_URL=redis://redis:6379
      - GATEWAY_A=http://gateway-a:8001
      - GATEWAY_B=http://gateway-b:8002
      - GATEWAY_C=http://gateway-c:8003
      - POLICY_DB=http://policy_db:8000
      - ADMIN_SECRET_TOKEN=${ADMIN_SECRET_TOKEN}
    depends_on:
      gateway-a:
        condition: service_healthy
      gateway-b:
        condition: service_healthy
      gateway-c:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
