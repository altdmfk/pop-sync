version: '3.8'
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  policy_db:
    build: .
    command: python policy_db.py
    ports:
      - "8000:8000"

  gateway-a:
    build: .
    command: python gateway.py --node Node-A --port 8001
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=http://policy_db:8000
    depends_on:
      - redis
      - policy_db

  gateway-b:
    build: .
    command: python gateway.py --node Node-B --port 8002
    ports:
      - "8002:8002"
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=http://policy_db:8000
    depends_on:
      - redis
      - policy_db

  gateway-c:
    build: .
    command: python gateway.py --node Node-C --port 8003
    ports:
      - "8003:8003"
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=http://policy_db:8000
    depends_on:
      - redis
      - policy_db

  control_plane:
    build: .
    command: python control_plane.py
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379
      - GATEWAY_A=http://gateway-a:8001
      - GATEWAY_B=http://gateway-b:8002
      - GATEWAY_C=http://gateway-c:8003
      - POLICY_DB=http://policy_db:8000
    depends_on:
      - gateway-a
      - gateway-b
      - gateway-c
