name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
        
    # E2E scripts (test_scenarios, test_rl_fallback, measure_*) need the docker cluster.
    # Run unit tests and chaos audit invariant verification here.
    - name: Run Unit Tests
      run: |
        pytest tests/test_singleflight.py tests/test_rate_limit.py tests/test_pop.py tests/test_chaos_audit.py -v
